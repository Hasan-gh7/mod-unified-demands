<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>دخول الإدارة - المطالب الموحدة</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="hero">
        <div class="container">

            <h1>دخول لوحة الإدارة</h1>

            <p>
                هذه الصفحة مخصصة لإدارة المبادرة
            </p>

        </div>
    </header>


    <main class="container">

        <section class="content-section">

            <h2>تسجيل الدخول</h2>

            <form id="loginForm">

                <div class="form-group">

                    <label for="username">
                        اسم المستخدم
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        autocomplete="username"
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        كلمة المرور
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        autocomplete="current-password"
                    >

                </div>


                <button type="submit">
                    تسجيل الدخول
                </button>

                <p id="loginMessage"></p>

            </form>

        </section>

    </main>


    <script src="js/admin-login.js"></script>

</body>

</html>
